[project]
name = "orangeinvest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
